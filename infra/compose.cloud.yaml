# Reference runtime for a VM with private, TLS-protected managed backing services.
# Do not combine with the development compose.yaml.
name: kernelhub-secops-cloud
x-runtime-env: &runtime-env
  APP_ENV: ${APP_ENV:-production}
  PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
  DATABASE_URL: ${DATABASE_URL:?set runtime database credential}
  BROKER_URL: ${BROKER_URL:?set broker credential}
  OIDC_ISSUER: ${OIDC_ISSUER:?set identity issuer}
  OIDC_INTERNAL_BASE: ${OIDC_INTERNAL_BASE:?set internal identity base}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-secops-web}
  OPENSEARCH_URL: ${OPENSEARCH_URL:?set private search endpoint}
  OPENSEARCH_USER: ${OPENSEARCH_USER}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
  S3_BUCKET: ${S3_BUCKET}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
x-app: &app
  image: ${APP_IMAGE:?set APP_IMAGE}:${RELEASE_TAG:?set RELEASE_TAG}
  environment: *runtime-env
  restart: unless-stopped
  networks: [application,egress]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=64m]
  mem_limit: 768m
  cpus: 1.0
services:
  edge:
    image: caddy:2.10.2-alpine
    ports: ["80:80","443:443"]
    environment: {DOMAIN: "${DOMAIN:?set DOMAIN}", ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL}"}
    volumes: ["./Caddyfile.cloud:/etc/caddy/Caddyfile:ro","caddydata:/data","caddyconfig:/config"]
    networks: [application,egress]
    restart: unless-stopped
    mem_limit: 128m
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}:${RELEASE_TAG}
    networks: [application]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
  migrate:
    <<: *app
    command: ["python","-m","secops.manage","migrate"]
    environment: {DATABASE_URL: "${MIGRATION_DATABASE_URL:?set migration credential}"}
    restart: "no"
    healthcheck: {disable: true}
  api:
    <<: *app
    environment:
      <<: *runtime-env
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set client credential}
      BOOTSTRAP_SUBJECT: ${BOOTSTRAP_SUBJECT:-}
      PRODUCT_NAME: ${PRODUCT_NAME:-KernelHub SecOps Cloud}
      BRAND_MARK: ${BRAND_MARK:-K}
      BRAND_ACCENT: "${BRAND_ACCENT:-#47e6bd}"
  worker:
    <<: *app
    command: ["celery","-A","secops.worker:celery","worker","--loglevel=WARNING","--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A secops.worker:celery inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
  scheduler:
    <<: *app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BROKER_URL: ${BROKER_URL}
    command: ["celery","-A","secops.worker:celery","beat","--loglevel=WARNING","--schedule=/tmp/celerybeat"]
    healthcheck:
      test: ["CMD", "python", "-m", "secops.health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 256m
networks:
  application: {internal: true}
  egress: {}
volumes:
  caddydata: {}
  caddyconfig: {}
