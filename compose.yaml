name: kernelhub-secops
x-runtime-env: &runtime-env
  APP_ENV: ${APP_ENV:-development}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  DATABASE_URL: ${DATABASE_URL:?run scripts/setup.py first}
  BROKER_URL: ${BROKER_URL:?run scripts/setup.py first}
  OIDC_ISSUER: ${OIDC_ISSUER}
  OIDC_INTERNAL_BASE: ${OIDC_INTERNAL_BASE}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-secops-web}
  OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
  OPENSEARCH_USER: ${OPENSEARCH_USER:-}
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
  S3_BUCKET: ${S3_BUCKET:-secops-events}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://objects:8333}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
x-app: &app
  build: ./backend
  environment: *runtime-env
  networks: [private]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp:size=64m]
  restart: unless-stopped
  mem_limit: 768m
  cpus: 1.0
services:
  edge:
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./infra/Caddyfile.dev:/etc/caddy/Caddyfile:ro"]
    networks: [private,egress]
    depends_on: [api,web,keycloak]
    mem_limit: 128m
    restart: unless-stopped
  web:
    build: ./frontend
    networks: [private]
    mem_limit: 512m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["python", "-m", "secops.manage", "migrate"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?run scripts/setup.py first}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    healthcheck: {disable: true}
  api:
    <<: *app
    environment:
      <<: *runtime-env
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      BOOTSTRAP_SUBJECT: ${BOOTSTRAP_SUBJECT}
      PRODUCT_NAME: ${PRODUCT_NAME:-KernelHub SecOps Cloud}
      BRAND_MARK: ${BRAND_MARK:-K}
      BRAND_ACCENT: "${BRAND_ACCENT:-#47e6bd}"
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *app
    command: ["celery", "-A", "secops.worker:celery", "worker", "--loglevel=WARNING", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A secops.worker:celery inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
  scheduler:
    <<: *app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BROKER_URL: ${BROKER_URL}
    command: ["celery", "-A", "secops.worker:celery", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "secops.health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 256m
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.py first}
      POSTGRES_DB: secops
    volumes: ["pgdata:/var/lib/postgresql", "./.local/pg-init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    networks: [private]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d secops"], interval: 5s, timeout: 3s, retries: 30}
    mem_limit: 1g
    restart: unless-stopped
  redis:
    image: redis:8.4.8-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory 192mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    volumes: ["redisdata:/data"]
    networks: [private]
    healthcheck: {test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"], interval: 5s, timeout: 3s, retries: 30}
    mem_limit: 256m
    restart: unless-stopped
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["searchdata:/usr/share/opensearch/data"]
    networks: [private]
    ulimits: {nofile: {soft: 65536, hard: 65536}}
    healthcheck: {test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null"], interval: 15s, timeout: 5s, retries: 30}
    mem_limit: 1536m
    restart: unless-stopped
  objects:
    image: chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: secops-events
    volumes: ["objectdata:/data"]
    networks: [private]
    mem_limit: 512m
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: http://localhost:8080/idp
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes: ["./.local/realm.json:/opt/keycloak/data/import/realm.json:ro"]
    networks: [private]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 768m
    restart: unless-stopped
networks:
  private: {internal: true}
  egress: {}
volumes:
  pgdata: {}
  redisdata: {}
  searchdata: {}
  objectdata: {}
