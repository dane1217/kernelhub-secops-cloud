# Example only; validate with the selected Fluent Bit release before deployment.
[SERVICE]
    Flush         1
    Log_Level     warn
    storage.path  /var/lib/fluent-bit/buffer

[INPUT]
    Name                systemd
    Tag                 linux.auth
    DB                  /var/lib/fluent-bit/journal.db
    Systemd_Filter      _SYSTEMD_UNIT=sshd.service
    Systemd_Filter      _SYSTEMD_UNIT=ssh.service
    Systemd_Filter_Type Or
    Read_From_Tail      On
    storage.type        filesystem

[FILTER]
    Name   modify
    Match  linux.auth
    Rename MESSAGE message
    Rename _HOSTNAME host

[OUTPUT]
    Name                     http
    Match                    linux.auth
    Host                     ${KH_INGEST_HOST}
    Port                     443
    URI                      /api/ingest
    Format                   json
    Json_date_key            timestamp
    Json_date_format         iso8601
    Header                   Authorization Bearer ${KH_INGEST_KEY}
    Header                   Content-Type application/json
    tls                      On
    tls.verify               On
    Retry_Limit              no_limits
    storage.total_limit_size 128M
